# Compose template for `insforge local start`. The CLI renders it into
# .insforge/local-compose.yml, substituting a marker line for a `configs:` block
# that inlines db-init.sql, server.ts and worker-template.js.
#
# Nothing is bind-mounted from the host — the same conclusion Supabase's CLI
# reaches by embedding its SQL in the binary and writing it in with a heredoc. It
# avoids Docker Desktop file-sharing prompts on Windows and SELinux relabelling on
# RHEL-family hosts entirely.
#
# It used to be a byte-identical copy of deploy/docker-compose/docker-compose.yml
# plus an overlay. That broke as soon as the upstream file started mounting
# ../docker-init/db/* — those paths resolve next to *this* file, inside the npm
# package, where they do not exist, so Postgres would get an empty directory
# mounted over its postgresql.conf. Keeping a copy also meant inheriting upstream
# bugs (a missing DENO_RUNTIME_URL broke every edge function) and 24 env
# passthroughs, and the copy silently went stale anyway.
#
# Everything Postgres needs is passed as `-c` flags or mounted out of the
# project's .insforge/ directory, so no image carries hand-baked config.
#
# Ports, keys and image tags come from the generated --env-file. Variables not
# listed here still reach the containers if set in the caller's environment,
# because Compose resolves from the process environment too:
#   GOOGLE_CLIENT_ID=... insforge local start

__INSFORGE_CONFIGS__

services:
  postgres:
    # insforge-db builds this multi-arch on every `v*` tag. Deliberately not
    # postgres-all, which bakes config in by hand for Railway's single-image
    # requirement and has drifted from the repo more than once.
    image: ghcr.io/insforge/postgres:v15.13.4

    # The official image's recommended layout: a subdirectory, not the mount
    # point itself. Pinned from the very first release of this command — changing
    # it later would make Postgres initdb an empty cluster beside the real one and
    # come up looking like a fresh install.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-insforge}
      PGDATA: /var/lib/postgresql/data/pgdata

    # Mirrors deploy/docker-init/db/postgresql.conf in the InsForge repo. Passed
    # as flags rather than mounting a conf file so there is one less file to keep
    # in sync; shared_preload_libraries works here even though it cannot be set
    # at runtime.
    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - shared_preload_libraries=pg_cron,http,pgcrypto,insforge_pg_utils
      - -c
      - cron.database_name=${POSTGRES_DB:-insforge}
      # insforge_pg_utils defaults both of these to project_admin; pinned so the
      # value is visible and cannot shift when the extension is rebuilt.
      - -c
      - insforge.policy_grant_role=project_admin
      - -c
      - insforge.extension_grant_role=project_admin
      - -c
      - insforge.policy_grant_tables=storage.objects,realtime.channels,realtime.messages,payments.stripe_checkout_sessions,payments.stripe_customer_portal_sessions,payments.razorpay_orders,payments.razorpay_subscriptions
      - -c
      - insforge.internal_schemas=ai,auth,compute,deployments,email,functions,memory,payments,realtime,schedules,storage,system
      - -c
      - app.encryption_key=${ENCRYPTION_KEY:-${JWT_SECRET:-dev-secret-please-change-in-production}}

    volumes:
      - postgres-data:/var/lib/postgresql/data
    configs:
      # Creates the anon / authenticated / project_admin roles. Has to run at
      # cluster init: PostgREST starts with PGRST_DB_ANON_ROLE=anon before the
      # backend migrates, so a migration cannot cover it.
      - source: db_init
        target: /docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks:
      - insforge-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  postgrest:
    image: postgrest/postgrest:v12.2.12
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-insforge}
      PGRST_OPENAPI_SERVER_PROXY_URI: http://localhost:3000
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:-dev-secret-please-change-in-production}
      PGRST_DB_CHANNEL_ENABLED: true
      PGRST_DB_CHANNEL: pgrst
    ports:
      - "127.0.0.1:${POSTGREST_PORT:-5430}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/3000'"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - insforge-network
    restart: unless-stopped

  insforge:
    image: ghcr.io/insforge/insforge-oss:${INSFORGE_STACK_TAG:-latest}
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
      postgrest:
        condition: service_healthy
    # Loopback only. This is a development backend on someone's laptop; the
    # upstream compose file publishes the API port on all interfaces, which would
    # expose the dashboard and the anon-key API surface to the whole LAN.
    ports:
      - "127.0.0.1:${APP_PORT:-7130}:7130"
      - "127.0.0.1:${AUTH_PORT:-7131}:7131"
    environment:
      PORT: 7130
      PROJECT_ROOT: /app
      API_BASE_URL: ${API_BASE_URL:-}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-please-change-in-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-${JWT_SECRET:-dev-secret-please-change-in-production}}
      ROOT_ADMIN_USERNAME: ${ROOT_ADMIN_USERNAME:-admin}
      ROOT_ADMIN_PASSWORD: ${ROOT_ADMIN_PASSWORD:-change-this-password}
      ADMIN_EMAIL: ${ROOT_ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ROOT_ADMIN_PASSWORD:-change-this-password}
      # Seeded on first boot so the CLI knows the keys before the container
      # starts and can link the directory without a round trip. The backend
      # ignores both once a key is stored, which is what makes a restart
      # idempotent.
      ACCESS_API_KEY: ${ACCESS_API_KEY}
      ACCESS_ANON_KEY: ${ACCESS_ANON_KEY}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-insforge}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-insforge}
      POSTGREST_BASE_URL: http://postgrest:3000
      # Without this the backend falls back to http://localhost:7133 — inside its
      # own container, where nothing listens — and every function invoke returns
      # 502 while deploy reports success.
      DENO_RUNTIME_URL: http://deno:7133
      STORAGE_DIR: /insforge-storage
      LOGS_DIR: /insforge-logs
      INSFORGE_DEPLOYMENT_METHOD: cli-local
      INSFORGE_TELEMETRY_DISABLED: ${INSFORGE_TELEMETRY_DISABLED:-}
      # Optional integrations. Empty by default; set them in your shell before
      # `insforge local start` to pass real values through.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      STRIPE_TEST_SECRET_KEY: ${STRIPE_TEST_SECRET_KEY:-}
      STRIPE_LIVE_SECRET_KEY: ${STRIPE_LIVE_SECRET_KEY:-}
      VERCEL_TOKEN: ${VERCEL_TOKEN:-}
      VERCEL_TEAM_ID: ${VERCEL_TEAM_ID:-}
      VERCEL_PROJECT_ID: ${VERCEL_PROJECT_ID:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      X_CLIENT_ID: ${X_CLIENT_ID:-}
      X_CLIENT_SECRET: ${X_CLIENT_SECRET:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_CLIENT_SECRET: ${APPLE_CLIENT_SECRET:-}
      # S3-compatible storage. Set by the --storage overlays; leave S3_BUCKET
      # empty to keep local filesystem storage.
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      S3_MAX_OBJECT_SIZE_BYTES: ${S3_MAX_OBJECT_SIZE_BYTES:-}
      S3_USE_PRESIGNED_URLS: ${S3_USE_PRESIGNED_URLS:-}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-}
    volumes:
      - storage-data:/insforge-storage
      - insforge-logs:/insforge-logs
    networks:
      - insforge-network
    restart: unless-stopped

  deno:
    # Official upstream image, with the function host supplied as a config.
    # ghcr.io/insforge/deno-runtime is not used: it is built in a third repository
    # and its copy of the host matches no commit in InsForge — 175 lines behind on
    # worker-template.js. The upstream compose file stopped using it too. No
    # in the chain. server.ts reads function code out of Postgres at request
    # time, so nothing user-specific is baked in either.
    image: denoland/deno:alpine-2.0.6
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DENO_PORT:-7133}:7133"
    environment:
      PORT: 7133
      DENO_ENV: development
      DENO_DIR: /deno-dir
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-insforge}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGREST_BASE_URL: http://postgrest:3000
      WORKER_TIMEOUT_MS: ${WORKER_TIMEOUT_MS:-60000}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-${JWT_SECRET:-dev-secret-please-change-in-production}}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-please-change-in-production}
    volumes:
      - deno_cache:/deno-dir
    configs:
      - source: deno_server
        target: /app/functions/server.ts
      - source: deno_worker
        target: /app/functions/worker-template.js
    command:
      - sh
      - -c
      - >-
        deno cache functions/server.ts &&
        exec deno run --allow-net --allow-env
        --allow-read=./functions/worker-template.js
        --unstable-worker-options functions/server.ts
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:7133/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - insforge-network
    restart: unless-stopped

volumes:
  postgres-data:
    driver: local
  deno_cache:
    driver: local
  storage-data:
    driver: local
  insforge-logs:
    driver: local

networks:
  insforge-network:
    driver: bridge
