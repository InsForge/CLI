# Everything specific to `insforge local start`.
#
# The base docker-compose.yml is a byte-identical copy of the InsForge repo's
# image-only compose file so it can be diff-checked against upstream. All
# local-only behavior lives here instead of being edited into that copy — which
# also means the OSS file needs no variables that only the CLI would ever set.
#
# --- Version pinning ----------------------------------------------------------
#
# The base file tracks :latest. INSFORGE_STACK_TAG lives here, not upstream,
# because the CLI is the only thing that sets it: `local start` resolves the
# newest release tag once per directory and records it, so an existing project
# never moves to a new backend version on its own. Unset (nothing resolved yet)
# leaves both images on :latest, matching the base file.
#
# --- Postgres -----------------------------------------------------------------
#
# Replaces ghcr.io/insforge/postgres-all with the base ghcr.io/insforge/postgres,
# which is the one with real CI: insforge-db builds it multi-arch on every `v*`
# tag. postgres-all is that same base plus three text files baked in by hand, and
# adds no extension binaries — insforge_pg_utils.so, pg_cron.so, http.so and
# vector.so are all already in the base image.
#
# Because those files were baked by hand they drifted: the published postgres-all
# lost insforge_pg_utils from shared_preload_libraries and all three insforge.*
# settings. Supplying them from the CLI makes that class of drift impossible for
# local instances — the settings and the init SQL are versioned with the CLI that
# reads them.
#
# Of the three baked files:
#   postgresql.conf → the `-c` flags below. Every entry is a plain GUC, and
#                     shared_preload_libraries works on the command line even
#                     though it cannot be set at runtime.
#   jwt.sql         → dropped. Nothing in the backend reads app.settings.jwt_secret
#                     or app.settings.jwt_exp, and it set them on the `postgres`
#                     database while the app database is `insforge`.
#   db-init.sql     → still a real file. It creates the anon / authenticated /
#                     project_admin roles, and PostgREST runs with
#                     PGRST_DB_ANON_ROLE=anon and starts as soon as Postgres is
#                     healthy — before the backend migrates. So the roles must
#                     exist at cluster-init time; a migration cannot cover them.
#                     The CLI writes it into the project's .insforge/ directory and
#                     passes the absolute path as INSFORGE_DB_INIT_SQL, because a
#                     path inside the user's own project is far likelier to be
#                     shared with Docker Desktop than one inside the npx cache.

services:
  postgres:
    # Not on the InsForge release train — the base image carries its own upstream
    # versioning, built multi-arch by insforge-db on every `v*` tag.
    image: ghcr.io/insforge/postgres:v15.13.4

    # Replaces the base file's command. Mirrors deploy/docker-init/db/postgresql.conf
    # in the InsForge repo — keep the two in sync.
    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
      - -c
      - shared_preload_libraries=pg_cron,http,pgcrypto,insforge_pg_utils
      - -c
      - cron.database_name=${POSTGRES_DB:-insforge}
      - -c
      - insforge.policy_grant_role=project_admin
      - -c
      - insforge.policy_grant_tables=storage.objects,realtime.channels,realtime.messages,payments.stripe_checkout_sessions,payments.stripe_customer_portal_sessions,payments.razorpay_orders,payments.razorpay_subscriptions
      - -c
      - insforge.internal_schemas=ai,auth,compute,deployments,email,functions,memory,payments,realtime,schedules,storage,system
      - -c
      - app.encryption_key=${ENCRYPTION_KEY:-${JWT_SECRET:-dev-secret-please-change-in-production}}

    volumes:
      - ${INSFORGE_DB_INIT_SQL}:/docker-entrypoint-initdb.d/01-init.sql:ro

  insforge:
    image: ghcr.io/insforge/insforge-oss:${INSFORGE_STACK_TAG:-latest}

    environment:
      # Seed the API key and anon key on first boot, so the CLI knows them before
      # the container starts and can link the directory without a round trip. The
      # backend ignores both once a key is stored, which is what makes a restart
      # idempotent. Set here rather than in the OSS compose file because nothing
      # but the CLI needs them.
      ACCESS_API_KEY: ${ACCESS_API_KEY}
      ACCESS_ANON_KEY: ${ACCESS_ANON_KEY}
      # Telemetry deployment channel — a literal, not a variable, because only
      # this overlay is ever used by the CLI.
      INSFORGE_DEPLOYMENT_METHOD: cli-local

  deno:
    image: ghcr.io/insforge/deno-runtime:${INSFORGE_STACK_TAG:-latest}
